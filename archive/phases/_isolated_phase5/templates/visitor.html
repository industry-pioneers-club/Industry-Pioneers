<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
    <title>تسجيل الزوار والانضمام | نادي رواد الصناعة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>

    <style>

        .login-btn {
            
            background-color: transparent;
            border: 2px solid #fff;
            padding: 8px 20px;
            border-radius: 20px;
            color: white;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
        }
        .login-btn:hover {
            background-color: #f39c12;
            border-color: #f39c12;
        }

        .form-container {
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .form-container h2 {
            color: #1b365d;
            margin-bottom: 20px;
            font-size: 24px;
            border-bottom: 2px solid #f39c12;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #333;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
        }
        .submit-btn {
            background-color: #1b365d;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background-color: #f39c12;
        }
    </style>
</head>
<body>
<template id="auth-links-source">
{% if current_user.is_authenticated %}
<a class="login-btn" href="{{ url_for('dashboard') }}">لوحتي</a>
<a class="login-btn" href="{{ url_for('logout') }}">تسجيل الخروج</a>
{% else %}
<a class="login-btn" href="{{ url_for('login_form') }}">تسجيل الدخول</a>
{% endif %}
</template>
    <!-- شريط التنقل العلوي المتطابق -->


    <section class="banner">
        <h1>بوابة الزوار والأعضاء</h1>
        <span class="sub">سجل معنا في فعاليات النادي أو انضم كعضو رسمي</span>
    </section>

    <!-- فورم تسجيل الزوار في الفعاليات -->
    <div class="form-container">
        <h2>تسجيل الزوار في الفعاليات</h2>
        <p id="eventFormMessage" style="display:none;padding:12px 16px;border-radius:8px;margin-bottom:14px;font-weight:700"></p>
        <form id="eventRegForm" method="POST" novalidate>
            <div class="form-group">
                <label for="visitor-name">الاسم الكامل</label>
                <input type="text" id="visitor-name" name="name" maxlength="120" placeholder="أدخل اسمك الكامل" required>
            </div>
            <div class="form-group">
                <label for="visitor-email">البريد الإلكتروني</label>
                <input type="email" id="visitor-email" name="email" maxlength="120" placeholder="example@email.com" required>
            </div>
            <div class="form-group">
                <label for="visitor-phone">رقم الجوال</label>
                <input type="tel" id="visitor-phone" name="phone" maxlength="40" placeholder="05xxxxxxxx">
            </div>
            <div class="form-group">
                <label for="event-select">اختر الفعالية</label>
                <select id="event-select" name="event_id" required>
{% for event in events %}
                    <option value="{{ event.id }}">{{ event.title }}</option>
{% else %}
                    <option value="">لا توجد فعاليات عامة</option>
{% endfor %}
                </select>
            </div>
            <button type="submit" class="submit-btn">تسجيل في الفعالية</button>
        </form>
    </div>

    <!-- فورم طلب الانضمام للنادي -->
    <div class="form-container">
        <h2>طلب انضمام لعضوية النادي</h2>
        <p id="membershipFormMessage" style="display:none;padding:12px 16px;border-radius:8px;margin-bottom:14px;font-weight:700"></p>
        <form id="membershipForm" method="POST" novalidate>
            <div class="form-group">
                <label for="member-name">الاسم الكامل</label>
                <input type="text" id="member-name" name="name" maxlength="120" placeholder="أدخل اسمك الكامل" required>
            </div>
            <div class="form-group">
                <label for="member-id">الرقم الجامعي</label>
                <input type="text" id="member-id" name="student_id" maxlength="50" placeholder="أدخل رقمك الجامعي" required>
            </div>
            <div class="form-group">
                <label for="member-major">التخصص الأكاديمي</label>
                <input type="text" id="member-major" name="major" maxlength="120" placeholder="أدخل تخصصك الأكاديمي" required>
            </div>
            <div class="form-group">
                <label for="member-email">البريد الإلكتروني</label>
                <input type="email" id="member-email" name="email" maxlength="120" placeholder="example@email.com">
                <small style="color:#666">اختياري — يستخدمه القائد للتواصل معك عند قبول الطلب.</small>
            </div>
            <div class="form-group">
                <label for="member-reason">لماذا تريد الانضمام لنادي رواد الصناعة؟</label>
                <textarea id="member-reason" name="reason" rows="4" maxlength="2000" placeholder="اكتب نبذة بسيطة عن سبب رغبتك بالانضمام"></textarea>
            </div>
            <button type="submit" class="submit-btn">إرسال طلب الانضمام</button>
        </form>
    </div>
</body>
</html>
