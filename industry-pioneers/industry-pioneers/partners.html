<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>الشركاء والرعاة | نادي رواد الصناعة</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>


<body>


    <!-- =========================
         العنوان الرئيسي
    ========================== -->

    <section class="banner">

        <h1>الشركاء والرعاة</h1>

        <span class="sub">
            شركاء النجاح الذين يدعمون رحلتنا
        </span>

    </section>



    <!-- =========================
         قسم الرعاة
    ========================== -->

    <section class="sec">

        <div class="wrap">

            <h2 class="st">
                الرعاة
            </h2>


            <div class="logos">


                <!-- سيدي للقهوة المختصة -->

                <div class="lg">

                    <img
                        src="Image/coffee.jpg"
                        alt="سيدي للقهوة المختصة"
                    >

                    <p>
                        سيدي للقهوة المختصة
                    </p>

                </div>



                <!-- شركة الزجاج العربية المتحدة -->

                <div class="lg">

                    <img
                        src="Image/glass.jpg"
                        alt="شركة الزجاج العربية المتحدة"
                    >

                    <p>
                        شركة الزجاج العربية المتحدة
                    </p>

                </div>



                <!-- مكتب الهندسة للاستشارات -->

                <div class="lg">

                    <img
                        src="Image/engineering.jpg"
                        alt="مكتب الهندسة للاستشارات"
                    >

                    <p>
                        مكتب الهندسة للاستشارات
                    </p>

                </div>


            </div>

        </div>

    </section>



    <!-- =========================
         قسم الشركاء
    ========================== -->

    <section class="sec">

        <div class="wrap">

            <h2 class="st">
                الشركاء
            </h2>


            <div class="logos">


                <!-- BusinessHub -->

                <div class="lg">

                    <img
                        src="Image/hero.png"
                        alt="BusinessHub"
                    >

                    <p dir="ltr">
                        BusinessHub
                    </p>

                </div>



                <!-- SPE KSA Section -->

                <div class="lg">

                    <img
                        src="Image/hero.png"
                        alt="SPE KSA Section"
                    >

                    <p dir="ltr">
                        SPE KSA Section
                    </p>

                </div>



                <!-- JAZARI Ventures -->

                <div class="lg">

                    <img
                        src="Image/hero.png"
                        alt="JAZARI Ventures"
                    >

                    <p dir="ltr">
                        JAZARI Ventures
                    </p>

                </div>



                <!-- SIBTL -->

                <div class="lg">

                    <img
                        src="Image/hero.png"
                        alt="SIBTL"
                    >

                    <p dir="ltr">
                        SIBTL
                    </p>

                </div>


            </div>

        </div>

    </section>


</body>

</html>
